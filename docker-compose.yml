services:
  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - AUTH_STORAGE_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_DIR=./logs
    volumes:
      - ./auth_info:/app/auth_info
      - ./data:/app/data
      - ./logs:/app/logs
      - ./flows:/app/flows
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stdin_open: true # Equivalente a -i (interactivo)
    tty: true # Equivalente a -t (tty), necesario para qrcode-terminal

  whatsapp-firebase:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-firebase
    env_file:
      - .env
    environment:
      - INTERFACE=${INTERFACE:-baileys}
      - FLOW_FILE=${FLOW_FILE:-flow_cfp412.json}
      - LEADS_STORAGE_TYPE=${LEADS_STORAGE_TYPE:-google_sheets}
      - AUTH_STORAGE_TYPE=${AUTH_STORAGE_TYPE:-firestore}
      - LOG_DIR=./logs
    volumes:
      - ./auth_info:/app/auth_info
      - ./data:/app/data
      - ./logs:/app/logs
      - ./flows:/app/flows
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: whatsapp-bot-test
    volumes:
      - ./src:/app/src
      - ./flows:/app/flows
      - ./data:/app/data
      - ./logs:/app/logs
    command: npm test

volumes:
  redis_data:
