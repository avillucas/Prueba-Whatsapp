x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - ./auth_info:/app/auth_info
    - ./data:/app/data
    - ./logs:/app/logs
    - ./flows:/app/flows
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped
  stdin_open: true
  tty: true

services:
  redis:
    image: redis:7-alpine
    container_name: whatsapp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles: ["local", "storage", "default"]

  whatsapp-local:
    <<: *app-base
    container_name: whatsapp-bot
    depends_on:
      - redis
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"
    environment:
      - INTERFACE=${INTERFACE:-baileys}
      - FLOW_FILE=${FLOW_FILE:-flow_cfp412.json}
      - LEADS_STORAGE_TYPE=${LEADS_STORAGE_TYPE:-csv}
      - AUTH_STORAGE_TYPE=${AUTH_STORAGE_TYPE:-redis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_DIR=./logs
      - ADMIN_PORT=${ADMIN_PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    profiles: ["local", "default"]

  whatsapp-firestore:
    <<: *app-base
    container_name: whatsapp-firestore
    ports:
      - "${ADMIN_PORT:-3000}:${ADMIN_PORT:-3000}"
    environment:
      - INTERFACE=${INTERFACE:-baileys}
      - FLOW_FILE=${FLOW_FILE:-flow_cfp412.json}
      - LEADS_STORAGE_TYPE=${LEADS_STORAGE_TYPE:-google_sheets}
      - AUTH_STORAGE_TYPE=${AUTH_STORAGE_TYPE:-firestore}
      - LOG_DIR=./logs
      - ADMIN_PORT=${ADMIN_PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    profiles: ["firestore", "firebase"]

  whatsapp-cli:
    <<: *app-base
    container_name: whatsapp-cli
    environment:
      - INTERFACE=command
      - FLOW_FILE=${FLOW_FILE:-flow_cfp412.json}
      - LEADS_STORAGE_TYPE=${LEADS_STORAGE_TYPE:-csv}
      - AUTH_STORAGE_TYPE=${AUTH_STORAGE_TYPE:-redis}
      - LOG_DIR=./logs
    profiles: ["cli"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: whatsapp-bot-test
    volumes:
      - ./src:/app/src
      - ./flows:/app/flows
      - ./data:/app/data
      - ./logs:/app/logs
    command: npm test
    profiles: ["test"]

volumes:
  redis_data:
