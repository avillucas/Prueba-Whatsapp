name: CI/CD Pipeline & GitHub Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout whatsapp-bot repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Si motor-decision está en un repositorio separado o submódulo, se clona o se emula para el build de npm
      - name: Setup motor-decision dependency
        run: |
          if [ -d "../motorDecision" ]; then
            echo "motorDecision local directory found."
          else
            echo "Mocking motorDecision for CI pipeline..."
            mkdir -p ../motorDecision
            echo '{"name":"motor-decision","version":"1.0.0","main":"dist/index.js"}' > ../motorDecision/package.json
            mkdir -p ../motorDecision/dist
            echo 'exports.DecisionEngine = class {}; exports.FlowProvider = class {};' > ../motorDecision/dist/index.js
          fi

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests with Coverage (100% Target)
        run: npm test

      - name: Build TypeScript Project
        run: npm run build

      - name: Validate Docker Build
        run: docker build -t whatsapp-bot:latest .

  deploy:
    name: Deploy Application to GCP
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Iniciando despliegue en Google Cloud..."
            cd ~/Prueba-Whatsapp || cd ~/app
            git pull origin main
            docker compose build whatsapp-bot
            docker compose up -d --remove-orphans
            echo "✅ Despliegue completado con éxito."

