name: CI/CD Pipeline & GitHub Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout whatsapp-bot repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Clonar y compilar la librería motorDecision desde GitHub si no se encuentra
      - name: Setup motor-decision dependency
        run: |
          if [ -d "../motorDecision" ]; then
            echo "Copiando motorDecision desde el directorio superior..."
            mkdir -p ./motorDecision
            cp -r ../motorDecision/* ./motorDecision/
          elif [ -d "motorDecision" ] && [ -f "motorDecision/package.json" ]; then
            echo "motorDecision ya existe en la raíz."
          else
            echo "Clonando motorDecision desde GitHub..."
            git clone https://github.com/avillucas/motorDecision.git ./motorDecision
          fi

          if [ -d "./motorDecision" ]; then
            echo "Instalando dependencias y compilando motorDecision..."
            cd ./motorDecision
            npm install
            npm run build
            cd ..
          fi


      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests with Coverage
        run: npm test

      - name: Build TypeScript Project
        run: npm run build

      - name: Validate Docker Build
        run: docker build -t whatsapp-bot:latest .

  deploy:
    name: Deploy Application to GCP
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy & Inject Secrets via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Verificando directorio de la aplicación en la VM de GCP..."
            TARGET_DIR=""
            for dir in "$HOME/Prueba-Whatsapp" "$HOME/prueba-whatsapp" "$HOME/whatsapp-bot" "$HOME/app"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              echo "📁 Directorio no encontrado. Clonando repositorio en $HOME/Prueba-Whatsapp..."
              git clone "https://github.com/${{ github.repository }}.git" "$HOME/Prueba-Whatsapp"
              TARGET_DIR="$HOME/Prueba-Whatsapp"
            fi

            cd "$TARGET_DIR"
            echo "📂 Directorio activo: $(pwd)"

            echo "🚀 Actualizando repositorio en el servidor..."
            git pull origin main || git pull origin master

            echo "🔒 Generando archivo .env de producción desde GitHub Secrets..."
            cat << 'EOF' > .env
            INTERFACE=${{ secrets.INTERFACE || 'baileys' }}
            FLOW_FILE=${{ secrets.FLOW_FILE || 'flow_cfp412.json' }}
            LEADS_STORAGE_TYPE=${{ secrets.LEADS_STORAGE_TYPE || 'google_sheets' }}
            AUTH_STORAGE_TYPE=${{ secrets.AUTH_STORAGE_TYPE || 'firestore' }}
            GCS_BUCKET_NAME="${{ secrets.GCS_BUCKET_NAME }}"
            GOOGLE_SERVICE_ACCOUNT_EMAIL="${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}"
            GOOGLE_PRIVATE_KEY="${{ secrets.GOOGLE_PRIVATE_KEY }}"
            GOOGLE_SPREADSHEET_ID="${{ secrets.GOOGLE_SPREADSHEET_ID }}"
            EOF

            # Otorgar permisos de lectura/escritura únicamente al dueño del servidor
            chmod 600 .env

            echo "🚀 Ejecutando script de despliegue Docker..."
            chmod +x ssh/deploy
            ./ssh/deploy
            echo "✅ Despliegue completado con éxito."
